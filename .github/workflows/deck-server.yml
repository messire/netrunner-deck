name: deck-server

# Every push to main that touches the server publishes static Linux builds and
# a Windows build to the rolling `deck-server-latest` release. Running deck-servers poll its
# deck-server.json and update themselves (server/src/deck_server/self_update.rs).

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/deck-server.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deck-server-release
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN_VERSION: 1.96.1

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: x86_64
          - target: aarch64-unknown-linux-musl
            arch: aarch64
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: ${{ matrix.target }}
      - uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943 # v1.0.2
        with:
          version: 0.16.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          key: ${{ matrix.target }}
      - name: Linux build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build musl-tools gcc-aarch64-linux-gnu
      - name: aarch64 linker
        if: matrix.arch == 'aarch64'
        run: echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - name: Test deck-agent and deck-accounts
        if: matrix.arch == 'x86_64'
        run: cargo test --locked -p deck-agent -p deck-accounts
      - name: Build
        env:
          HERDR_BUILD_COMMIT: ${{ github.sha }}
        run: cargo build --release --locked --bin deck-server --target ${{ matrix.target }}
      - name: Package
        run: |
          name=deck-server-linux-${{ matrix.arch }}
          cp target/${{ matrix.target }}/release/deck-server "$GITHUB_WORKSPACE/$name"
          cd "$GITHUB_WORKSPACE"
          file "$name" | grep -Eq "static(ally|-pie) linked"
          sha256sum "$name" | cut -d' ' -f1 > "$name.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: deck-server-linux-${{ matrix.arch }}
          path: |
            deck-server-linux-${{ matrix.arch }}
            deck-server-linux-${{ matrix.arch }}.sha256

  windows:
    # VS 2022's MSVC headers: the newer ones on windows-latest demand Clang 22,
    # newer than Zig 0.16's, for the vendored libghostty-vt C++ (simdutf).
    runs-on: windows-2022
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
      - uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943 # v1.0.2
        with:
          version: 0.16.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          key: windows
      - name: Build
        env:
          HERDR_BUILD_COMMIT: ${{ github.sha }}
        run: cargo build --release --locked --bin deck-server
      - name: Package
        shell: pwsh
        run: |
          $name = "deck-server-windows-x86_64.exe"
          Copy-Item target/release/deck-server.exe "$env:GITHUB_WORKSPACE/$name"
          (Get-FileHash "$env:GITHUB_WORKSPACE/$name" -Algorithm SHA256).Hash.ToLower() | Set-Content -NoNewline "$env:GITHUB_WORKSPACE/$name.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: deck-server-windows-x86_64
          path: |
            deck-server-windows-x86_64.exe
            deck-server-windows-x86_64.exe.sha256

  publish:
    needs: [build, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Manifest
        run: |
          jq -cn --arg commit "$GITHUB_SHA" \
            --arg x "$(cat deck-server-linux-x86_64.sha256)" \
            --arg a "$(cat deck-server-linux-aarch64.sha256)" \
            --arg w "$(cat deck-server-windows-x86_64.exe.sha256)" \
            '{commit: $commit, assets: {
               x86_64: {name: "deck-server-linux-x86_64", sha256: $x},
               aarch64: {name: "deck-server-linux-aarch64", sha256: $a},
               "windows-x86_64": {name: "deck-server-windows-x86_64.exe", sha256: $w}}}' > deck-server.json
          cat deck-server.json
      - name: Publish deck-server-latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view deck-server-latest >/dev/null 2>&1; then
            gh release create deck-server-latest --prerelease --latest=false \
              --target "$GITHUB_SHA" --title "deck-server (latest main)" \
              --notes "Rolling Linux and Windows builds of deck-server; running servers update from it."
          fi
          # Binaries first, manifest last: a server never sees a manifest
          # that points at binaries not uploaded yet.
          gh release upload deck-server-latest --clobber \
            deck-server-linux-x86_64 deck-server-linux-aarch64 deck-server-windows-x86_64.exe
          gh release upload deck-server-latest --clobber deck-server.json
