name: release

# A pushed tag `vX.Y.Z` (matching package.json) becomes a GitHub Release with
# the signed Windows installer, its `.sig`, the bare executable and `latest.json`
# for the in-app updater. Only this workflow may write to the repository
# (releases); build.yml stays read-only.
#
# Secrets (repository → Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY           contents of the updater private key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password
# The matching public key is `plugins.updater.pubkey` in src-tauri/tauri.conf.json.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: tag → GitHub Release (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: tag matches package.json
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag does not match package.json $pkg" >&2
            exit 1
          fi
          node scripts/sync-version.mjs --check
      - run: npm run typecheck
      - run: npm test
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: signing key is configured
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY secret is missing: an unsigned build cannot be offered by the updater" >&2
            exit 1
          fi
      - run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: collect artifacts + latest.json
        shell: bash
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          mkdir -p dist-release
          cp src-tauri/target/release/netrunner-deck.exe "dist-release/netrunner-deck-${GITHUB_REF_NAME}-windows-x64.exe"
          setup=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe)
          test -f "$setup.sig" || { echo "no signature next to $setup" >&2; exit 1; }
          name="netrunner-deck_${ver}_x64-setup.exe"
          cp "$setup" "dist-release/$name"
          cp "$setup.sig" "dist-release/$name.sig"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${name}"
          node -e '
            const [version, url, sig] = process.argv.slice(1);
            const notes = `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/tag/v${version}`;
            console.log(JSON.stringify({ version, notes, pub_date: new Date().toISOString(),
              platforms: { "windows-x86_64": { url, signature: sig } } }, null, 2));
          ' "$ver" "$url" "$(cat "$setup.sig")" > dist-release/latest.json
          cat dist-release/latest.json
          ls -la dist-release
      - uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
